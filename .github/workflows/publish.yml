name: Publish

on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag v$TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test index.test.ts

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: npm pack dry run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Extract tag annotation
        run: |
          git cat-file -p "${GITHUB_REF_NAME}" | sed '1,/^$/d' > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body_path: release-notes.md
          generate_release_notes: true
